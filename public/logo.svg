    stroke="#64748B" stroke-width="12" stroke-linecap="round" fill="none" 
  />
  
  <!-- Core (Final Compressed Output) -->
  <rect x="216" y="216" width="80" height="80" rx="16" fill="#10B981" />
  
  <!-- Diagonal Compression Vectors -->
  <path 
    d="M 120 120 L 180 180 M 180 180 L 180 145 M 180 180 L 145 180" 
    stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" 
  />
  <path 
    d="M 392 392 L 332 332 M 332 332 L 332 367 M 332 332 L 367 332" 
    stroke="#10B981" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" 
  />
</svg>
