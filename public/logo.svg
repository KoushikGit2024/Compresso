<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="100" fill="#FFFFFF" />
  
  <!-- Outer Boundary (Original Uncompressed Size) -->
  <rect 
    x="106" y="106" width="300" height="300" rx="32" 
    stroke="#CBD5E1" stroke-width="12" stroke-dasharray="24 24" fill="none" 
  />
  
  <!-- Mid Boundary (The "C" Shape / Lossless Stage) -->
  <path 
    d="M 346 220 
       V 190 A 24 24 0 0 0 322 166 
       H 190 A 24 24 0 0 0 166 190 
       V 322 A 24 24 0 0 0 190 346 
       H 322 A 24 24 0 0 0 346 322 
