<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Compress, crop and compare images right in your browser." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Compresso" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compresso - Image Compresser</title>
    <!-- Apply dark class synchronously before paint to prevent flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
